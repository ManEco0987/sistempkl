<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SIM SMK TI Bali Global</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="deco" viewBox="0 0 720 500" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <polygon points="720,0 720,260 260,0" fill="var(--gold)" opacity="0.55"/>
  <polygon points="720,0 720,180 430,0" fill="var(--flame)" opacity="0.55"/>
</svg>

<div class="card">
  <div class="panel">
    <div class="spin-stage">
      <img src="logo.png" alt="Logo SMK TI Bali Global" class="logo-spin">
    </div>
  </div>

  <div class="form-area">
    <h1>Login</h1>
    <p class="sub">Masuk ke Sistem Informasi SMK TI Bali Global</p>

    <form autocomplete="off">
      <div class="field select-field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v14H6a2 2 0 0 0-2 2Z"/><path d="M4 19.5A2 2 0 0 0 6 21h13"/></svg>
        <select required>
          <option value="" disabled selected>Login sebagai</option>
          <option value="siswa">Siswa</option>
          <option value="guru">Guru</option>
          <option value="industri">Pembimbing Industri</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.4-3.6 4.3-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/></svg>
        <input type="text" placeholder="Username" required>
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9" rx="1.8"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" placeholder="Password" required>
      </div>

      <div class="row-between">
        <label class="remember"> </label>
        <a href="#">Lupa password?</a>
      </div>

      <button type="submit" class="btn-login">LOGIN</button>
    </form>

    <p class="form-foot">Belum punya akun? <a href="#">Hubungi admin sekolah</a></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
